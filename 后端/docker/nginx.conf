# ============================================
# WildAPI - Nginx 反向代理配置
# 前端静态资源 + 后端 API 代理 + SSE 流式支持
# ============================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 上传限制 (备份恢复文件最大 500MB)
    client_max_body_size 500m;

    # backend 容器缺席时 nginx 也要能起来: 静态写法会让 nginx 在启动阶段解析 upstream，
    # 失败即整个前端容器退出 (后端构建失败/单独起 frontend 时最容易出现)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- 后端 API 代理 ----
    location /api/ {
        set $wildapi_backend http://backend:3000;
        proxy_pass $wildapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ---- AI API 代理 (兼容 OpenAI 协议，支持 SSE 流式) ----
    location /v1/ {
        set $wildapi_backend http://backend:3000;
        proxy_pass $wildapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
}
